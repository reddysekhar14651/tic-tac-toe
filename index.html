<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game">
    <h1>Tic Tac Toe</h1>
    <div class="config">
      <label>Rows <input type="number" id="rows" value="3" min="3" max="10"></label>
      <label>Cols <input type="number" id="cols" value="3" min="3" max="10"></label>
      <label>Win <input type="number" id="win-length" value="3" min="3" max="10"></label>
    </div>
    <p class="status" id="status"></p>
    <div class="board" id="board"></div>
    <button class="reset" id="reset">New Game</button>
    <p class="mode-link"><a href="index-vs-computer.html">Play vs Computer →</a></p>
  </div>
  <script type="module" src="script.js"></script>
</body>
</html>
